name: go

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon
          POSTGRES_DB: recon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recon"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      RECON_TEST_PG_DSN: postgres://recon:recon@127.0.0.1:5432/recon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
